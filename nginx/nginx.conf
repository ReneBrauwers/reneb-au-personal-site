pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout combined;
  error_log /dev/stderr warn;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css application/xml image/svg+xml;

  upstream recruiter_portal {
    server portal:8080;
    keepalive 8;
  }

  server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      add_header Cache-Control "no-store";
      return 200 "healthy\n";
    }

    location = /readyz {
      proxy_pass http://recruiter_portal;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location ~ ^/(?:recruiters|llms\.txt|candidate\.json|robots\.txt|sitemap\.xml)$ {
      proxy_pass http://recruiter_portal;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /recruiters/profile.md {
      proxy_pass http://recruiter_portal;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /privacy {
      proxy_pass http://recruiter_portal;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location ^~ /portal-assets/ {
      proxy_pass http://recruiter_portal;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location ~ ^/(?:auth|portal|admin)(?:/|$) {
      client_max_body_size 11m;
      proxy_pass http://recruiter_portal;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_buffering off;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /index.html {
      return 308 /;
    }

    location = / {
      proxy_pass http://recruiter_portal;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location ~* \.(?:css|png|svg|webp)$ {
      expires 1d;
      add_header Cache-Control "public, max-age=86400";
      try_files $uri =404;
    }

    location / {
      try_files $uri =404;
    }
  }
}
