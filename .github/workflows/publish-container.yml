name: Publish container

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/renebrauwers/reneb-au-personal-site

jobs:
  validate-and-publish:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build validation containers
        run: |
          docker compose build web
          docker compose --profile qa build qa

      - name: Validate HTML
        run: docker compose --profile qa run --rm qa npm run html

      - name: Validate CSS
        run: docker compose --profile qa run --rm qa npm run css

      - name: Run responsive and accessibility checks
        run: docker compose --profile qa run --rm qa npm run validate

      - name: Run Lighthouse
        run: docker compose --profile qa run --rm qa npm run lighthouse

      - name: Clean up validation containers
        if: always()
        run: docker compose --profile qa down --volumes --remove-orphans

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Publish summary
        run: |
          {
            echo "### Published container"
            echo "- Image: \`${IMAGE_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Digest: \`${{ steps.publish.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
