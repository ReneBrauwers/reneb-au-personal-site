name: reneb-au-personal-site

services:
  portal:
    image: reneb-au-recruiter-portal:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: portal/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RECRUITER_PORTAL_ENABLED: "true"
      ADMIN_EMAILS: admin@example.invalid
      UNTRUSTED_EMAIL_DOMAINS: gmail.com,outlook.com,hotmail.com
      DISPOSABLE_EMAIL_DOMAINS: mailinator.com,10minutemail.com,yopmail.com
      Portal__DataDirectory: /app/data
      Portal__BackupDirectory: /app/backups
      Encryption__AllowDevelopmentKey: "true"
      Mail__Mode: Development
      AllowedHosts: reneb.au;localhost;127.0.0.1;portal;web
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777,nosuid,nodev
    volumes:
      - portal-data:/app/data
      - portal-backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  web:
    image: reneb-au-personal-site:${IMAGE_TAG:-local}
    build:
      context: .
    depends_on:
      portal:
        condition: service_healthy
    ports:
      - "${SITE_BIND_ADDRESS:-127.0.0.1}:${SITE_PORT:-8091}:8080"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777,nosuid,nodev
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  qa:
    profiles: ["qa"]
    build:
      context: ./qa
    depends_on:
      web:
        condition: service_healthy
    environment:
      QA_BASE_URL: http://web:8080
      QA_MAIL_URL: http://portal:8080/dev/mail
      QA_OUTPUT_DIR: /work/artifacts/local
    volumes:
      - ./artifacts:/work/artifacts
      - ./site:/work/site:ro
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777,nosuid,nodev

volumes:
  portal-data:
  portal-backups:
